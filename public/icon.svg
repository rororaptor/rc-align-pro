<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Outer reticle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1e293b" stroke-width="2" />
  
  <!-- Angle degree ticks -->
  <line x1="256" y1="56" x2="256" y2="90" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="422" x2="256" y2="456" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <line x1="56" y1="256" x2="90" y2="256" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <line x1="422" y1="256" x2="456" y2="256" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  
  <!-- Inclined RC Wheel (Camber demonstration) -->
  <g transform="rotate(-8, 256, 256)">
    <!-- Tire tread / Tyre -->
    <rect x="206" y="106" width="100" height="300" rx="36" fill="#0f172a" stroke="#10b981" stroke-width="8" />
    <line x1="206" y1="170" x2="306" y2="170" stroke="#334155" stroke-width="3" />
    <line x1="206" y1="256" x2="306" y2="256" stroke="#334155" stroke-width="3" />
    <line x1="206" y1="342" x2="306" y2="342" stroke="#334155" stroke-width="3" />
    
    <!-- Rim Hub -->
    <circle cx="256" cy="256" r="32" fill="#10b981" />
    <circle cx="256" cy="256" r="14" fill="#020617" />
    <!-- Hex nut spokes -->
    <line x1="256" y1="210" x2="256" y2="302" stroke="#020617" stroke-width="5" />
    <line x1="216" y1="233" x2="296" y2="279" stroke="#020617" stroke-width="5" />
    <line x1="216" y1="279" x2="296" y2="233" stroke="#020617" stroke-width="5" />
  </g>
  
  <!-- Laser plumb line -->
  <line x1="256" y1="80" x2="256" y2="432" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6" opacity="0.85" />
  <!-- Angle arc -->
  <path d="M 256 120 A 136 136 0 0 0 236 123" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <!-- Text angle label -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#10b981" letter-spacing="2">RC ALIGN</text>
</svg>
